[package]
name = "sigmaos-usb"
version = "0.1.0"
edition = "2021"
authors = ["SigmaOS Project"]
description = "USB and TPM support"
license = "GPL-3.0-or-later"
repository = "https://github.com/AaryanSinghChauhan09/SigmaOS-usb"
readme = "README.md"
keywords = ["usb", "tpm", "hardware"]
categories = ["hardware-support"]

[dependencies]
sigmaos-kernel = { version = "0.1", path = "../SigmaOS-kernel" }

[profile.release]
opt-level = 3
